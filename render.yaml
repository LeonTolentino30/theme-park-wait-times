# Preparation only. Creating a Blueprint is a separate approved deployment action.
services:
  - type: web
    name: queue-atlas
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements-render.txt && python -B -m src.deployment_build
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 60 --access-logfile - --error-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
